<script>
(() => {
  'use strict';
  const W = 960, H = 540, INK = '#2b2320';
  const cv = document.getElementById('game'), mainCtx = cv.getContext('2d', { alpha: false });
  let ctx = mainCtx, scale = 1, lowQ = false;
  const makeCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; };
  const rand = (a, b) => a + Math.random() * (b - a), pick = a => a[Math.floor(Math.random() * a.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const IMG = {};
  Object.keys(SPR).forEach(n => { const im = new Image(); im.src = SPR[n]; IMG[n] = im; });

  // ---------- drawing helpers ----------
  function rr(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);

    text('Монет: ' + save.coins + ' (они идут и в «Прятки»)', W / 2, 92, 22, '#5d5550', 'center', 'Nunito');
    const cw = 200, ch = 112, gx = 24, x0 = (W - (cw * 4 + gx * 3)) / 2;
    LEVELS.forEach((l, i) => {
      const x = x0 + (i % 4) * (cw + gx), y = 118 + Math.floor(i / 4) * (ch + 16), open = i === 0 || save.best[i - 1] > 0;
      rr(x, y, cw, ch, 16); sf(open ? (l.dim > 0.5 ? '#d8cfe8' : l.snow ? '#e4eef7' : l.rain ? '#d6dde3' : '#fff') : '#d7d0c5', 3);
      outlined(String(i + 1), x + 18, y + 20, 28, open ? '#d1495b' : '#8b8177');
      text(l.n, x + cw / 2 + 10, y + 34, 27, open ? INK : '#8b8177', 'center', 'Caveat', cw - 44);
      text(l.sub, x + cw / 2, y + 63, 20, '#6d635b', 'center', 'Caveat', cw - 16);
      [-1, 0, 1].forEach(q => star(x + cw / 2 + q * 26, y + 88, 10, save.best[i] >= q + 2));

    // bonus tiles

      const x = x0 + j * (cw * 2 + gx * 2), y = 374, w = cw * 2 + gx;
      rr(x, y, w, 64, 16); sf(t > 0 ? '#ffe7a3' : '#ece6db', 3);
      sprite(ico, x + 36, y + 32, 44);
      text(n + (t > 0 ? ` — можно сыграть: ${t}` : ''), x + w / 2 + 10, y + 22, 25, INK);
      text(t > 0 ? 'Нажми и держись!' : `Собери 3 ${ico === 'bone' ? 'косточки' : 'рыбки'} в поездках (${ico === 'bone' ? save.bones : save.fish}/3)`, x + w / 2 + 10, y + 46, 19, '#6d635b');
      if (t > 0) btns.push({ x, y, w, h: 64, fn: () => { introOf = { bonus: k }; scr = 'intro'; } });
    });
    legend(454);
    // settings row
    button(W - 186, 10, 172, 44, (ui.mus ? '♪ Музыка: да' : '♪ Музыка: нет'), () => { ui.mus = !ui.mus; applySound(); persist(); }, '#fff', 22);
    button(14, 10, 172, 44, (ui.snd ? '🔊 Звуки: да' : '🔇 Звуки: нет'), () => { ui.snd = !ui.snd; applySound(); persist(); }, '#fff', 22);
    if (!isIos && document.documentElement.requestFullscreen && !document.fullscreenElement) button(W - 186, 60, 172, 40, 'На весь экран', goFull, '#f2c14e', 22);
    if (isIos && !standalone) text('iPhone: «Поделиться» → «На экран Домой», чтобы играть на весь экран', W / 2, 525, 17, '#6d635b', 'center', 'Nunito');
  }
  let introOf = null;
  function drawIntro() {
    paper();
    const l = introOf.bonus ? BONUS[introOf.bonus] : LEVELS[introOf.i];
    outlined(introOf.bonus ? l.n : `${introOf.i + 1}. ${l.n}`, W / 2, 60, 58, '#d1495b');
    text(l.sub, W / 2, 110, 30, '#5d5550');
    if (introOf.bonus === 'yoda') { toon('dog', 240, 330, 1, 'happy', 1.2); text('Йода сел за руль, машина виляет!', 600, 180, 28, INK); text('Лови номера, пока он рулит. Очки ×2.', 600, 220, 26, INK); text('Йода лает на кошек — за них ещё бонус.', 600, 258, 26, INK); text('Проиграть нельзя!', 600, 300, 28, '#3f9a5a'); }
    else if (introOf.bonus === 'murka') { toon('cat', 240, 330, 1, 'calm', 1.3); text('Мурка за рулём: то газ, то тормоз!', 600, 180, 28, INK); text('Сама включает дворники и бибикает.', 600, 220, 26, INK); text('Очки ×2. Проиграть нельзя!', 600, 260, 28, '#3f9a5a'); }
    else {
      rr(140, 140, 680, 170, 18); sf('#fff', 3);
      text('Задание: ' + taskText(), W / 2, 176, 30, INK);
      star(260, 226, 15, true); text(`${l.g[0]} очков — поездка удалась`, 290, 226, 25, INK, 'left');
      star(250, 266, 15, true); star(276, 266, 15, true); text(`${l.g[1]} очков`, 300, 266, 25, INK, 'left');
      star(556, 246, 15, true); star(582, 246, 15, true); star(608, 246, 15, true); text('+ задание', 632, 246, 25, INK, 'left');
      text('Нажимай на машину с цветным номером, пока она не проехала!', W / 2, 340, 24, '#5d5550');
      legend(370);
    }
    button(W / 2 - 230, 455, 200, 64, '← Назад', () => { scr = 'menu'; }, '#fff', 30);
    button(W / 2 + 30, 455, 200, 64, 'Поехали!', () => { introOf.bonus ? (save.tickets[introOf.bonus]--, persist(), startLevel(-1, introOf.bonus)) : startLevel(introOf.i); }, '#f2c14e', 34);
  }
  function drawResult() {
    paper();
    const l = R.bonus ? BONUS[R.bonus] : LEVELS[R.i];
    outlined(R.pass ? (R.bonus ? 'Вот это поездка!' : 'Приехали!') : 'Мало очков…', W / 2, 56, 58, R.pass ? '#3f9a5a' : '#9a3b2a');
    text(l.n, W / 2, 104, 28, '#5d5550');
    [-1, 0, 1].forEach(q => star(W / 2 + q * 60, 158, 26, R.stars >= q + 2));
    outlined(R.score + ' очков', W / 2, 220, 46, '#b8860b');
    if (!R.pass) text(`Нужно хотя бы ${l.g[0]}. Попробуй ещё раз!`, W / 2, 262, 26, '#9a3b2a');
    else if (l.task) text(R.task ? '✓ Задание выполнено' : '✗ Задание не выполнено: ' + taskText(), W / 2, 262, 25, R.task ? '#3f9a5a' : '#9a3b2a');
    let x = 120;
    SPECIAL.forEach(t => { chip(t, x, 290, 96); outlined('×' + (R.found[t] || 0), x + 48, 330, 26, INK); x += 120; });
    text('🐶🐱 ×' + R.pets, x + 50, 302, 24, INK, 'center', 'Nunito');
    text(`+${R.coins} монет` + (R.mistakes ? `  ·  ошибок: ${R.mistakes}` : ''), W / 2, 372, 26, '#5d5550', 'center', 'Nunito');
    const bx = W / 2 - 330; let n = 0;
    const B = (label, fn, col) => { button(bx + n * 230, 400, 210, 60, label, fn, col, 28); n++; };
    B('Меню', () => { scr = 'menu'; }, '#fff');
    B('Ещё раз', () => { R.bonus ? (save.tickets[R.bonus] > 0 ? (save.tickets[R.bonus]--, persist(), startLevel(-1, R.bonus)) : (scr = 'menu')) : startLevel(R.i); }, '#fff');
    if (!R.bonus && R.pass && R.i < LEVELS.length - 1) B('Дальше →', () => { introOf = { i: R.i + 1 }; scr = 'intro'; }, '#f2c14e');
    if (save.tickets.yoda > 0 || save.tickets.murka > 0) {
      const k = save.tickets.yoda > 0 ? 'yoda' : 'murka';
      button(W / 2 - 210, 472, 420, 56, k === 'yoda' ? 'Йода хочет порулить!' : 'Мурка хочет порулить!', () => { introOf = { bonus: k }; scr = 'intro'; }, '#ffe7a3', 28);
    }
  }
  function drawPause() {
    ctx.fillStyle = 'rgba(29,26,25,.6)'; ctx.fillRect(0, 0, W, H);
    rr(W / 2 - 200, 130, 400, 280, 22); sf('#fbf6ea', 3);
    outlined('Пауза', W / 2, 176, 50, '#d1495b');
    button(W / 2 - 150, 214, 300, 54, 'Продолжить', () => { scr = 'play'; }, '#f2c14e', 30);
    button(W / 2 - 150, 280, 300, 54, 'Заново', () => { G.bonus ? (scr = 'menu') : startLevel(G.i); }, '#fff', 30);
    button(W / 2 - 150, 346, 300, 54, 'В меню', () => { engineSet(0, false); scr = 'menu'; }, '#fff', 30);
  }
  function drawTurn() {
    ctx.fillStyle = 'rgba(29,26,25,.9)'; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.translate(W / 2, 220); ctx.rotate(Math.sin(clock * 2) * 0.6 - 0.6); rr(-50, -90, 100, 180, 16); sf('#fbf6ea', 4); ctx.restore();
    outlined('Поверни телефон боком', W / 2, 380, 52, '#f2c14e');
    text('или нажми, чтобы играть так', W / 2, 440, 28, '#f4efe6');
    btns.push({ x: 0, y: 0, w: W, h: H, fn: () => { portraitOk = true; } });
  }

  // ---------- frame ----------
  let last = 0, slow = 0;
  function frame(ts) {
    const dt = Math.min(0.05, (ts - last) / 1000 || 0.016); last = ts;
    if (dt > 0.03) slow += dt; else slow = Math.max(0, slow - dt * 0.5);
    if (slow > 2.5 && !lowQ) { lowQ = true; layout(); }
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    btns = [];
    if (scr === 'play' || scr === 'pause') {
      if (scr === 'play') update(dt); else clock += dt;
      ctx.save();
      if (G.roll) { ctx.translate(CX, H / 2); ctx.rotate(G.roll); ctx.translate(-CX, -H / 2); ctx.scale(1.05, 1.05); ctx.translate(-24, -14); }
      drawWorld();
      ctx.restore();
      for (const b of G.birds) drawBird(b);
      drawGlass();
      drawCabin();
      if (G.flash > 0) { ctx.fillStyle = 'rgba(255,250,220,.35)'; ctx.fillRect(0, 0, W, H); }
      drawHUD();
      if (scr === 'pause') { btns = []; drawPause(); }
      musicTick(L.mus);
    } else {
      clock += dt;
      if (scr === 'menu') drawMenu(); else if (scr === 'intro') drawIntro(); else if (scr === 'result') drawResult();
      musicTick(5);
    }
    if (portrait && !portraitOk) { btns = []; drawTurn(); }
    requestAnimationFrame(frame);
  }

  // ---------- input ----------
  cv.addEventListener('pointerdown', e => {
    e.preventDefault(); unlockSound();
    const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
    if (scr === 'play') { tapPlay(x, y); return; }
    for (let i = btns.length - 1; i >= 0; i--) { const b = btns[i]; if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { sfx.click(); b.fn(); return; } }
  });
  addEventListener('keydown', e => { if (e.key === 'Escape' && scr === 'play') scr = 'pause'; if (e.key === ' ' && scr === 'play') useWiper(); });
  ['gesturestart', 'gesturechange', 'gestureend', 'dblclick'].forEach(n => document.addEventListener(n, e => e.preventDefault(), { passive: false }));
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { if (scr === 'play') scr = 'pause'; if (actx) actx.suspend(); engineSet(0, false); } else if (actx) actx.resume(); });

  // ---------- layout ----------
  const isTouch = navigator.maxTouchPoints > 0 || (window.matchMedia && matchMedia('(pointer: coarse)').matches);
  const isIos = /iP(hone|od|ad)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const standalone = navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches);
  let portrait = false;
  function layout() {
    const vv = window.visualViewport, zoomed = vv && vv.scale > 1.02;
    const vw = zoomed || !vv ? innerWidth : vv.width, vh = zoomed || !vv ? innerHeight : vv.height;
    const w = Math.floor(Math.min(vw, vh * 16 / 9)), h = Math.floor(w * 9 / 16);
    cv.style.width = w + 'px'; cv.style.height = h + 'px';
    portrait = isTouch && vh > vw;
    if (!portrait) portraitOk = false;
    const k = lowQ ? 1 : clamp(w * (window.devicePixelRatio || 1) / W, 1, 1.6);
    if (Math.abs(k - scale) > 0.01 || cv.width !== Math.round(W * k)) { scale = k; cv.width = Math.round(W * k); cv.height = Math.round(H * k); }
    window.scrollTo(0, 0);
  }
  addEventListener('resize', layout); addEventListener('orientationchange', () => setTimeout(layout, 120));
  if (window.visualViewport) { visualViewport.addEventListener('resize', layout); visualViewport.addEventListener('scroll', layout); }
  function goFull() {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().then(() => { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); }).catch(() => {});
  }
  // a swipe from the screen edge is Safari's Back: keep the player in the game
  let guarded = false;
  function guardBack() { if (guarded || !history.pushState) return; guarded = true; try { history.pushState({ nm: 1 }, ''); } catch (e) { guarded = false; } }
  addEventListener('popstate', () => { if (guarded && scr === 'play') { try { history.pushState({ nm: 1 }, ''); } catch (e) { /* stay */ } scr = 'pause'; } else guarded = false; });

  layout();
  requestAnimationFrame(frame);
  if (location.hash.startsWith('#test')) window.__nm = { get G() { return G; }, get L() { return L; }, get scr() { return scr; }, set scr(v) { scr = v; }, get R() { return R; }, save, startLevel, update, tapPlay, finish, LEVELS, BONUS, get btns() { return btns; }, P: (x, y, z) => P(x, y, z), useWiper, collect, drawWorld, drawCabin, drawHUD };
})();
